[package]
name = "agent-tui"
description = "A terminal client for the agent runtime: connects to a agent-gateway over HTTP/SSE, lists a tenant's sessions, and streams a turn's records live as a chat transcript"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "agent-tui"
path = "src/main.rs"

[dependencies]
# The agent runtime record/outcome types the gateway serializes onto the wire. Sharing
# them keeps the client in lockstep with the server's JSON instead of mirroring a
# second copy that could drift.
agent.workspace = true

ratatui.workspace = true
crossterm.workspace = true
tokio.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true

# The shared hand-rolled HTTP/1.1 substrate (origins, TCP/TLS connect, request
# framing, incremental reader) — no `reqwest`; SSE reads the chunked body live.
agent-http.workspace = true

[lints]
workspace = true
