[package]
name = "granary"
description = "Durable objects (\"grains\"): virtual, durable, single-activation actors with colocated event-sourced storage (granary spec)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
actor-simulation = { workspace = true, optional = true }
actor-core.workspace = true
actor-cluster.workspace = true
actor-serialization.workspace = true
compat.workspace = true
wal.workspace = true
blake3.workspace = true
# `fs`, for the store directory's single-writer `flock` (`file_store`). Already in
# the graph via `cap-std`; cargo unions this with the workspace's `process` feature.
rustix = { workspace = true, features = ["fs"] }
serde = { workspace = true }
serde_json.workspace = true
postcard.workspace = true
futures.workspace = true
async-channel.workspace = true
rusqlite = { workspace = true, optional = true }

[dev-dependencies]
# Its own `testing` module, for this crate's swarm suites.
granary = { path = ".", features = ["testing"] }
actor-simulation.workspace = true
trybuild.workspace = true
tempfile.workspace = true

[features]
# The SQL facet (spec §7.14): a private on-disk SQLite database per grain.
# Off by default to keep the base crate free of the bundled C dependency.
sql = ["dep:rusqlite"]
# Shared simulation invariants over grain events, for swarm suites in this
# crate and in crates layered on it (machine). Test support, so it stays out
# of a production build.
testing = ["dep:actor-simulation"]
