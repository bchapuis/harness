[package]
name = "agent"
description = "The agent runtime: compound AI sessions as journaled actors on the cluster"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
actor-simulation = { workspace = true, optional = true }
entity.workspace = true
# The autonomy mechanism this crate's loop is one policy over (workflow spec
# §2.1). `Agent` implements `Workflow`: the cycle, the claims, the orphan
# classification and the straggler filter are all this dependency's, and what
# stays here is the agentic half plus the environment no fold can express.
workflow.workspace = true
actor-core.workspace = true
actor-cluster.workspace = true
serde.workspace = true
serde_json.workspace = true
futures.workspace = true

[dev-dependencies]
spec.workspace = true
# Its own `testing` module, for this crate's swarm suites.
agent = { path = ".", features = ["testing"] }
actor-simulation.workspace = true
tempfile.workspace = true

[features]
# Shared simulation invariants over agent events, for the swarm suites in
# this crate. Test support, so it stays out of a production build.
testing = ["dep:actor-simulation"]

[lints]
workspace = true
