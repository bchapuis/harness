[package]
name = "harness"
description = "The agentic harness: compound AI sessions as journaled actors on the cluster"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
actor-simulation = { workspace = true, optional = true }
granary.workspace = true
actor-core.workspace = true
actor-cluster.workspace = true
actor-serialization.workspace = true
serde.workspace = true
serde_json.workspace = true
futures.workspace = true

[dev-dependencies]
# Its own `testing` module, for this crate's swarm suites.
harness = { path = ".", features = ["testing"] }
actor-simulation.workspace = true
tempfile.workspace = true

[features]
# Shared simulation invariants over harness events, for the swarm suites in
# this crate. Test support, so it stays out of a production build.
testing = ["dep:actor-simulation"]

[lints]
workspace = true
