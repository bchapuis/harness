name: CI

# Build + lint + the full conformance suite on every change. The workspace test
# run includes the deterministic conformance tests, the catalogue drift gate
# (tests/conformance_catalogue.rs), and every fixed-seed swarm sweep at its
# declared width from seed 0: the regression corpus (spec §18.6). Each sweep
# declares its seed range and cost class in the test (actor-simulation's
# sweep.rs); this job runs the declared range whole.
#
# This job runs the corpus and only the corpus: the same seeds every time, so a
# fixed bug cannot come back unnoticed. Its value comes from *not* varying.
# Discovery, the fresh seeds of §18.6's "many seeds per change", is soak.yml's
# job, which sweeps from a per-run SWARM_SEED_BASE. A failure there reproduces
# from its (base, seed) pair and is then committed here as a regression case.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Swarm sweeps run at their declared width from seed 0: the pinned §18.6
  # corpus. Unset, a local run takes its cost class's width instead (a few
  # seeds for an ordinary sweep, one for a sweep whose seeds cost seconds;
  # coverage sweeps run their declared width everywhere; see
  # actor-simulation/src/sweep.rs, which bans sizing by wall clock). `full`
  # states this job's contract in the workflow; nothing reads the runner's
  # own `CI` variable.
  SWARM_SEEDS: full

jobs:
  test:
    name: build, lint, conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No toolchain action: `rust-toolchain.toml` pins the version and its
      # components, and rustup installs it on the first cargo invocation. Naming
      # a version here too would give the pin a second source of truth to drift
      # from, and the compile-fail snapshots only hold on the pinned rustc.

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      # --locked: the committed Cargo.lock is the build, here and below. A
      # manifest change that forgot to refresh the lock fails by name instead
      # of resolving to whatever the registry holds that day.
      - name: Build
        run: cargo build --locked --workspace --all-targets

      - name: Clippy (warnings are errors)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # Nextest rather than `cargo test`: one process per test with live
      # per-test status and timings, so a hung sweep names itself instead of
      # stalling a silent binary. The `ci` profile (.config/nextest.toml) runs
      # everything: the default profile's swarm exclusion is a local-edit-loop
      # concern, and this job's value comes from the full corpus.
      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Test (conformance suite + swarm regression corpus)
        run: cargo nextest run --locked --workspace --profile ci

      # Nextest does not run doc-tests; keep them under cargo test.
      - name: Doc-tests
        run: cargo test --locked --workspace --doc

      # Rustdoc is a checked artifact: every intra-doc link resolves, with every
      # feature on and private items included, because the mechanism docs live
      # in private modules. Cargo.toml's `[workspace.lints.rustdoc]` holds the
      # lint levels; this step turns the remaining warnings into errors.
      - name: Rustdoc (warnings are errors)
        run: RUSTDOCFLAGS="-D warnings" cargo doc --locked --workspace --all-features --no-deps --document-private-items

  # The guest-backed suites (sandbox spec §3.5, machine spec §2.1): boot real
  # guests. The microVM mechanism needs /dev/kvm: available on GitHub's
  # x86_64 Linux runners once the udev rule below widens the device's
  # permissions, and the container mechanism needs the runner image.
  # The assets (kernel, rootfs with each guest agent, VMM binary) are built by
  # the guest build scripts, which also run each agent's own test suite inside
  # rust:alpine; asset builds are cached on the script plus agent sources, so
  # an agent change rebuilds (and re-tests) while everything else reuses.
  # E2E_REQUIRE turns the e2e tests' skip-on-missing-prerequisite conduct into
  # a failure here: this job exists to run them, so a broken environment must
  # not read as green, which is also why every prerequisite they name has to
  # be built below, and not just the KVM-gated ones.
  firecracker:
    name: firecracker microVM conformance
    runs-on: ubuntu-latest
    env:
      E2E_REQUIRE: 1
      # The e2e machine boots a small alpine guest; a smaller image keeps the
      # asset cache light.
      MACHINE_MB: 512
    steps:
      - uses: actions/checkout@v4

      # Toolchain and components come from `rust-toolchain.toml` (see above).

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Cache the sandbox microVM assets
        id: fc-assets
        uses: actions/cache@v4
        with:
          path: guest/fc-rootfs/out
          key: fc-assets-${{ runner.os }}-${{ hashFiles('guest/fc-rootfs/build.sh', 'guest/fc-agent/**') }}

      - name: Cache the machine microVM assets
        id: machine-assets
        uses: actions/cache@v4
        with:
          path: guest/machine-rootfs/out
          key: machine-assets-${{ runner.os }}-${{ env.MACHINE_MB }}-${{ hashFiles('guest/machine-rootfs/build.sh', 'guest/machine-agent/src/**', 'guest/machine-agent/Cargo.*', 'crates/machine-proto/**') }}

      - name: Build the sandbox assets (agent, rootfs, kernel, VMM)
        if: steps.fc-assets.outputs.cache-hit != 'true'
        run: guest/fc-rootfs/build.sh

      - name: Build the machine assets (agent, rootfs, kernel, VMM)
        if: steps.machine-assets.outputs.cache-hit != 'true'
        run: guest/machine-rootfs/build.sh

      # The container mechanism's half of the machine e2e: the runner image
      # that loop-mounts the machine's disk. Built unconditionally rather than
      # cached: it is alpine plus two packages, and the runner's docker daemon
      # starts empty every run anyway. The rootfs it chroots into is the
      # machine.ext4 built above, so this step follows that one.
      - name: Build the container mechanism's runner image
        run: guest/machine-docker/build.sh

      - name: Clippy (feature firecracker)
        run: |
          cargo clippy -p agent-sandbox --features firecracker --all-targets -- -D warnings
          cargo clippy -p machine-entity --features host --all-targets -- -D warnings

      - name: Test the sandbox tier (protocol suite + KVM-gated conformance)
        run: cargo test -p agent-sandbox --features firecracker

      - name: Test the machine binding (ws sync suite + microVM and container e2e)
        if: ${{ !cancelled() }}
        run: cargo test -p machine-entity --features host --lib --test hosted_e2e
